<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loja do Clube — Estrela Afonsoeirense</title>
<link rel="icon" type="image/png" href="crest.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#0b0b0c;
  --surface:#19191a;
  --border:#2d2d2e;
  --yellow:#f4c60c;
  --text:#f5f3ea;
  --muted:#9a958c;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{background:var(--bg);color:var(--text);margin:0;font-family:'Barlow',system-ui,sans-serif;display:flex;flex-direction:column;}
a{color:inherit;}
.top{padding:14px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);flex:0 0 auto;}
.home-link{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-family:'Barlow',sans-serif;font-size:12px;font-weight:600;text-decoration:none;letter-spacing:.02em;}
.home-link:hover{color:var(--yellow);}
.crest{width:28px;height:28px;object-fit:contain;flex:0 0 auto;}
.title{font-family:'Oswald',sans-serif;font-weight:700;font-size:15px;letter-spacing:.04em;text-transform:uppercase;margin:0;}
.frame-wrap{flex:1 1 auto;min-height:0;}
iframe{width:100%;height:100%;border:none;display:block;background:#fff;}
</style>
</head>
<body>
<div class="top">
  <a class="home-link" href="index.html">&larr; Início</a>
  <img class="crest" src="crest.png" alt="Estrela Afonsoeirense">
  <h1 class="title">Loja do Clube</h1>
</div>
<div class="frame-wrap">
  <iframe src="https://desportiva.pt/loja/efcafonsoeirense/" title="Loja do Estrela Afonsoeirense" loading="lazy"></iframe>
</div>
</body>
</html>
