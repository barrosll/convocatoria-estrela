[build]
  publish = "."
  functions = "netlify/functions"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':!state.json' ':!draft.json' ':!avisos.json' ':!avisos-img/*' ':!resultados.json' ':!torneio.json'"

[[redirects]]
  from = "/crest.png"
  to = "/crest.png"
  status = 200

[[redirects]]
  from = "/*"
  to = "/manutencao.html"
  status = 200
  force = true
